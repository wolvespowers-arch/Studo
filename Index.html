<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studo">
<title>Studo</title>
<link rel="apple-touch-icon" id="ati"><link rel="manifest" id="mf">
<style>
:root{--bg:#F2F5FF;--card:#fff;--ink:#14204A;--mut:#5C6794;--pri:#1B2A5B;--acc:#FFC83D;--ok:#1FA37F;--no:#D8434F;--line:#D9DFF3}
body[data-t=d]{--bg:#0E1530;--card:#18224A;--ink:#EDF0FF;--mut:#9AA5D6;--pri:#FFC83D;--line:#2B3768}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:#1B2A5B;color:#fff}
header b{font-size:24px;letter-spacing:.5px}
#sk{background:#FFC83D;color:#1B2A5B;border-radius:20px;padding:3px 12px;font-weight:700;font-size:14px}
main{padding:16px;max-width:560px;margin:auto}
.v{display:none}.v.on{display:block}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
textarea{min-height:170px;resize:vertical}
.btn,.ghost{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 18px;cursor:pointer}
.btn{background:var(--pri);color:var(--bg);width:100%}
body[data-t=d] .btn{color:#14204A}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.seg{display:flex;gap:6px;margin:16px 0 12px}
.seg button{flex:1;font:inherit;font-size:14px;padding:9px 4px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#1B2A5B;font-weight:700}
#out,.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
li{margin-bottom:10px}
.fc{border:2px dashed var(--line);border-radius:12px;padding:22px 16px;min-height:130px;cursor:pointer}
.fa{display:none;margin-top:12px;font-weight:700;color:var(--ok);font-size:20px}
.fc.flip .fa{display:block}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px;color:var(--mut)}
.row .btn{width:auto}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:12px;margin-top:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--no);border-color:var(--no);color:#fff}
.big{font-size:26px;font-weight:800;margin:6px 0}.mut{color:var(--mut);font-size:14px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.wk{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:10px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.wk i{display:block;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;margin-bottom:4px}
#tm{font-size:64px;font-weight:800;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.two{display:flex;gap:10px}.two>*{flex:1}
label.sw{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;font:inherit;font-size:13px;padding:14px 0;border:0;background:none;color:var(--mut)}
nav button.on{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--acc)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1B2A5B;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
</style></head>
<body>
<header><b>Studo</b><span id="sk">Streak 0</span></header>
<main>
<section class="v on" id="v-study">
<textarea id="tx" placeholder="Paste your notes here"></textarea>
<input id="ti" placeholder="Title (optional)">
<button class="btn" onclick="mk()">Make study set</button>
<div id="res" hidden>
<div class="seg"><button data-m="sum" onclick="show('sum')">Summary</button><button data-m="cards" onclick="show('cards')">Flashcards</button><button data-m="quiz" onclick="show('quiz')">Quiz</button></div>
<div id="out"></div>
<button class="ghost" onclick="sv()">Save to library</button>
</div>
</section>
<section class="v" id="v-lib"><div id="ll"></div></section>
<section class="v" id="v-goal"><div id="gl"></div></section>
<section class="v" id="v-timer">
<div class="box"><div class="two"><select id="du" onchange="setDur(this.value)"><option value="15">15 min</option><option value="25" selected>25 min</option><option value="45">45 min</option></select></div>
<div id="tm">25:00</div>
<div class="two"><button class="btn" id="tb" onclick="tgl()">Start</button><button class="ghost" onclick="rst()">Reset</button></div>
<p class="mut">Finished sessions count toward your streak.</p></div>
</section>
<section class="v" id="v-more">
<div class="box">
<label class="sw">Dark mode<input type="checkbox" id="dk" style="width:auto;margin:0" onchange="S.dark=this.checked;save();th()"></label>
<label>Daily goal (cards)</label><input type="number" id="gi" min="1" max="200" onchange="S.goal=Math.max(1,+this.value||10);save()">
<label>Daily reminder time</label><input type="time" id="ri" onchange="S.rem=this.value;save()">
<button class="ghost" onclick="askN()">Allow notifications</button>
<p class="mut">Reminders work while Studo is open on your phone.</p>
<button class="ghost" onclick="if(confirm('Delete all Studo data?')){localStorage.removeItem(K);location.reload()}">Reset all data</button>
</div>
</section>
</main>
<div id="toast"></div>
<nav>
<button data-v="study" class="on" onclick="go('study')">Study</button>
<button data-v="lib" onclick="go('lib')">Library</button>
<button data-v="goal" onclick="go('goal')">Goals</button>
<button data-v="timer" onclick="go('timer')">Timer</button>
<button data-v="more" onclick="go('more')">More</button>
</nav>
<script>
const $=i=>document.getElementById(i),K='studo1';
let S={sets:[],days:{},goal:10,dark:false,rem:'',lastRem:''};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const td=()=>new Date().toLocaleDateString('en-CA');
const day=()=>S.days[td()]||(S.days[td()]={m:0,c:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400)}
function th(){document.body.dataset.t=S.dark?'d':'l'}
function streak(){let n=0,d=new Date();const a=x=>{const v=S.days[x.toLocaleDateString('en-CA')];return v&&(v.c>0||v.m>0)};if(!a(d))d.setDate(d.getDate()-1);while(a(d)){n++;d.setDate(d.getDate()-1)}return n}
function hdr(){$('sk').textContent='Streak '+streak()}
function go(n){document.querySelectorAll('.v').forEach(v=>v.classList.toggle('on',v.id==='v-'+n));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===n));if(n==='lib')lib();if(n==='goal')goals();window.scrollTo(0,0)}
const SW=new Set('about above after again also because been before being between both could does doing down during each from further have having here into just more most other over same should some such than that their them then there these they this those through under until very were what when where which while will with would your'.split(' '));
const wds=s=>(s.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>!SW.has(w));
function build(txt){
const ss=(txt.replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g)||[]).map(s=>s.trim()).filter(s=>s.split(' ').length>=5);
if(ss.length<2)return null;
const f={};ss.forEach(s=>wds(s).forEach(w=>f[w]=(f[w]||0)+1));
const sc=ss.map((s,i)=>{const w=wds(s);return{s,i,v:w.reduce((a,x)=>a+f[x],0)/Math.sqrt(w.length+1)}});
const top=n=>sc.slice().sort((a,b)=>b.v-a.v).slice(0,n).sort((a,b)=>a.i-b.i);
const sum=top(Math.min(4,Math.ceil(ss.length/3))).map(x=>x.s);
const cards=[];
top(8).forEach(x=>{const w=wds(x.s);if(!w.length)return;const k=w.sort((a,b)=>(f[b]+b.length)-(f[a]+a.length))[0];cards.push({q:x.s.replace(new RegExp('\\b'+k+'\\b','i'),'_____'),a:k})});
return{sum,cards,pool:Object.keys(f).filter(w=>w.length>4)}}
let cur=null,ci=0,qi=0,qs=0;
function mk(){const t=$('tx').value;if(t.trim().length<80){toast('Paste a longer note first');return}
const r=build(t);if(!r){toast('Add at least 2 full sentences');return}
cur=r;cur.title=$('ti').value.trim()||t.trim().slice(0,30);$('res').hidden=false;show('sum')}
function show(m){if(!cur)return;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
if(m==='sum')$('out').innerHTML='<ul>'+cur.sum.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
else if(m==='cards'){ci=0;card()}else{qi=0;qs=0;qz()}}
function card(){const c=cur.cards[ci];if(!c){$('out').innerHTML='<p class="big">Deck done</p><p class="mut">Streak '+streak()+'</p>';return}
$('out').innerHTML='<div class="fc" onclick="this.classList.toggle(\'flip\')"><div>'+esc(c.q)+'</div><div class="fa">'+esc(c.a)+'</div></div><div class="row"><span>'+(ci+1)+' / '+cur.cards.length+' · tap card to flip</span><button class="btn" onclick="nx()">Next</button></div>'}
function nx(){day().c++;save();hdr();ci++;card()}
function qz(){const c=cur.cards[qi];if(!c){$('out').innerHTML='<p class="big">Score: '+qs+' / '+cur.cards.length+'</p>';return}
const o=shuf([c.a,...shuf(cur.pool.filter(w=>w!==c.a)).slice(0,3)]);
$('out').innerHTML='<p>'+esc(c.q)+'</p>'+o.map(w=>'<button class="opt" data-w="'+esc(w)+'">'+esc(w)+'</button>').join('')+'<p class="mut">'+(qi+1)+' / '+cur.cards.length+'</p>';
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.w===c.a)x.classList.add('ok')});if(b.dataset.w===c.a)qs++;else b.classList.add('no');day().c++;save();hdr();setTimeout(()=>{qi++;qz()},900)})}
function sv(){if(!cur)return;S.sets.unshift({id:Date.now(),title:cur.title,sum:cur.sum,cards:cur.cards,pool:cur.pool});save();toast('Saved to library')}
function lib(){const l=$('ll');if(!S.sets.length){l.innerHTML='<div class="box">No saved sets yet. Make a study set and tap Save to library.</div>';return}
l.innerHTML=S.sets.map(s=>'<div class="box"><b>'+esc(s.title)+'</b><div class="mut">'+s.cards.length+' cards</div><div class="two" style="margin-top:10px"><button class="btn" data-o="'+s.id+'">Open</button><button class="ghost" data-d="'+s.id+'">Delete</button></div></div>').join('');
l.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{cur=S.sets.find(s=>s.id==b.dataset.o);go('study');$('res').hidden=false;show('sum')});
l.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.sets=S.sets.filter(s=>s.id!=b.dataset.d);save();lib()})}
function goals(){const d=day(),p=Math.min(100,Math.round(d.c/S.goal*100));let w='';
for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);const v=S.days[x.toLocaleDateString('en-CA')]||{c:0};w+='<div><i style="height:'+Math.min(70,v.c*6)+'px"></i>'+x.toLocaleDateString('en',{weekday:'narrow'})+'</div>'}
$('gl').innerHTML='<div class="box"><div class="mut">Streak</div><div class="big">'+streak()+' days</div></div><div class="box"><div class="mut">Today</div><div class="big">'+d.c+' / '+S.goal+' cards</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="mut">'+d.m+' min focused</div></div><div class="box"><div class="mut">Last 7 days</div><div class="wk">'+w+'</div></div>'}
let tDur=25,tLeft=1500000,tEnd=0,tRun=false;
function tdraw(){let ms=tRun?tEnd-Date.now():tLeft;if(tRun&&ms<=0){tdone();return}const s=Math.round(ms/1000);$('tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tgl(){if(tRun){tLeft=tEnd-Date.now();tRun=false;$('tb').textContent='Start'}else{tEnd=Date.now()+tLeft;tRun=true;$('tb').textContent='Pause'}tdraw()}
function rst(){tRun=false;tLeft=tDur*60000;$('tb').textContent='Start';tdraw()}
function setDur(m){tDur=+m;rst()}
function tdone(){tRun=false;tLeft=tDur*60000;$('tb').textContent='Start';day().m+=tDur;save();hdr();tdraw();note('Studo','Focus session done. Take a short break.')}
function note(t,b){if('Notification' in window&&Notification.permission==='granted'){try{new Notification(t,{body:b,icon:ico})}catch(e){}}toast(b);if(navigator.vibrate)navigator.vibrate(200)}
function askN(){if(!('Notification' in window)){toast('Notifications are not supported here');return}Notification.requestPermission().then(p=>toast(p==='granted'?'Notifications on':'Notifications blocked'))}
setInterval(tdraw,500);
setInterval(()=>{if(!S.rem)return;const n=new Date(),h=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(h===S.rem&&S.lastRem!==td()){S.lastRem=td();save();note('Studo','Time to study. Keep your streak going.')}},20000);
let ico='';
(function(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
x.fillStyle='#1B2A5B';x.fillRect(0,0,512,512);x.fillStyle='#FFC83D';x.beginPath();x.arc(256,256,170,0,7);x.fill();
x.fillStyle='#1B2A5B';x.font='bold 250px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('S',256,278);
ico=c.toDataURL('image/png');$('ati').href=ico;
const m={name:'Studo',short_name:'Studo',start_url:location.href.split('#')[0],display:'standalone',background_color:'#1B2A5B',theme_color:'#1B2A5B',icons:[{src:ico,sizes:'512x512',type:'image/png'}]};
$('mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))})();
$('dk').checked=S.dark;$('gi').value=S.goal;$('ri').value=S.rem;th();hdr();
</script>
</body></html>
